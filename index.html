<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Diario Lampo" />
  <title>Diario Lampo</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131922;
      --card-2: #19222f;
      --text: #eef2f6;
      --muted: #94a3b8;
      --line: #253142;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.14);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --info: #38bdf8;
      --info-soft: rgba(56, 189, 248, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .icon-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .stats-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .kcal-big {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .kcal-target {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .bar-wrap {
      height: 10px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease, background 0.25s ease;
    }

    .stats-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    input[type="time"],
    textarea,
    select {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .field {
      margin-bottom: 11px;
    }

    .preset-box {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .preset-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .preset-head label {
      margin: 0;
      color: var(--text);
    }

    .preset-head select {
      width: auto;
      padding: 6px 10px;
      font-size: 0.85rem;
      background: var(--card);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .preset-btn {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 9px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .preset-btn:active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .preset-btn-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: #bbf7d0;
    }

    .preset-btn-desc {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active-drift {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: #fde68a;
    }

    .chip.active-reflux-none {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #bbf7d0;
    }

    .chip.active-reflux-mild {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: #fde68a;
    }

    .chip.active-reflux-high {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #fecaca;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-ai {
      background: var(--info-soft);
      border-color: rgba(56, 189, 248, 0.45);
      color: #bae6fd;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #06210f;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--info);
      min-height: 18px;
    }

    .entry {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 11px;
      margin-bottom: 9px;
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .entry-title {
      font-weight: 700;
      font-size: 0.94rem;
    }

    .entry-kcal {
      font-weight: 800;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .entry-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .b-drift {
      background: var(--warn-soft);
      color: #fde68a;
    }

    .b-reflux-0 {
      background: var(--accent-soft);
      color: #bbf7d0;
    }

    .b-reflux-1 {
      background: var(--warn-soft);
      color: #fde68a;
    }

    .b-reflux-2 {
      background: var(--danger-soft);
      color: #fecaca;
    }

    .entry-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .mini-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 2px 4px;
    }

    .mini-link.del {
      color: #fca5a5;
    }

    .export-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hidden {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 10px;
      margin-top: 8px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Diario Lampo</h1>
        <div class="sub" id="todayLabel">Pasti, drift e reflusso · Locale su iPhone</div>
      </div>
      <button class="icon-btn" id="toggleSettingsBtn" type="button">⚙️ Impostazioni</button>
    </header>

    <!-- Pannello Impostazioni -->
    <section class="card hidden" id="settingsPanel">
      <div class="field">
        <label for="apiKeyInput">Google Gemini API Key (salvata solo su questo iPhone)</label>
        <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off" />
        <div class="sub" style="margin-top:4px;">Necessaria solo per analizzare foto o testo libero con Gemini.</div>
      </div>

      <div class="row-2 field">
        <div>
          <label for="modelSelect">Modello Gemini</label>
          <select id="modelSelect">
            <option value="gemini-3.8-flash">gemini-3.8-flash (consigliato)</option>
            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (rapido)</option>
            <option value="gemini-flash-latest">gemini-flash-latest</option>
            <option value="custom">Modello personalizzato...</option>
          </select>
        </div>
        <div>
          <label for="targetKcalInput">Target giornaliero (kcal)</label>
          <input type="number" id="targetKcalInput" min="1000" max="4500" step="25" />
        </div>
      </div>

      <div class="field hidden" id="customModelField">
        <label for="customModelInput">ID Modello personalizzato</label>
        <input type="text" id="customModelInput" placeholder="Es. gemini-3.7-flash" autocomplete="off" />
      </div>

      <div class="btn-row" style="margin-bottom:0;">
        <button class="btn" id="saveSettingsBtn" type="button">Salva impostazioni</button>
        <button class="btn" id="triggerRestoreBtn" type="button">Ripristina backup JSON</button>
        <input type="file" id="restoreFileInput" accept="application/json" class="hidden" />
      </div>
    </section>

    <!-- Contatore Giornaliero -->
    <section class="card">
      <div class="stats-top">
        <div>
          <span class="kcal-big" id="kcalConsumed">0</span>
          <span class="kcal-target">kcal oggi</span>
        </div>
        <div class="kcal-target" id="kcalRemaining">Residuo: 1.725 kcal</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" id="kcalBar"></div>
      </div>
      <div class="stats-meta">
        <span id="proteinSummary">Proteine stimate: 0 g</span>
        <span id="driftCountSummary">Drift oggi: 0</span>
      </div>
    </section>

    <!-- Inserimento Rapido -->
    <section class="card">
      <!-- Pasti Predefiniti dal Piano Settimanale -->
      <div class="preset-box">
        <div class="preset-head">
          <label for="planDaySelect">📋 Pasti predefiniti</label>
          <select id="planDaySelect">
            <option value="Giorno 1">Giorno 1</option>
            <option value="Giorno 2">Giorno 2</option>
            <option value="Giorno 3">Giorno 3</option>
            <option value="Giorno 4">Giorno 4</option>
            <option value="Giorno 5">Giorno 5</option>
            <option value="Giorno 6">Giorno 6</option>
            <option value="Giorno 7">Giorno 7</option>
          </select>
        </div>
        <div class="preset-grid" id="presetButtons"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-ai" id="photoBtn" type="button">📷 Foto Piatto (AI)</button>
        <button class="btn btn-ai" id="aiTextBtn" type="button">✨ Stima Testo (AI)</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" />
      </div>

      <div class="row-2 field">
        <div>
          <label for="mealType">Momento</label>
          <select id="mealType">
            <option value="Colazione">Colazione</option>
            <option value="Pranzo">Pranzo</option>
            <option value="Spuntino">Spuntino</option>
            <option value="Merenda">Merenda</option>
            <option value="Cena" selected>Cena</option>
            <option value="Extra/Serale">Extra / Serale</option>
          </select>
        </div>
        <div>
          <label for="mealTime">Ora</label>
          <input type="time" id="mealTime" />
        </div>
      </div>

      <div class="field">
        <label for="mealDesc">Cosa hai mangiato / bevuto</label>
        <textarea id="mealDesc" placeholder="Scegli un pasto predefinito sopra, scatta una foto o scrivi qui..."></textarea>
        <img id="photoPreview" class="preview-img hidden" alt="Anteprima piatto" />
      </div>

      <div class="row-2 field">
        <div>
          <label for="mealKcal">Calorie (kcal)</label>
          <input type="number" id="mealKcal" min="0" max="4000" step="5" placeholder="Auto o manuale" />
        </div>
        <div>
          <label for="mealProtein">Proteine (g)</label>
          <input type="number" id="mealProtein" min="0" max="250" step="1" placeholder="Opzionale" />
        </div>
      </div>

      <div class="field">
        <label>Drift / Trigger (tocca per selezionare)</label>
        <div class="chip-group" id="driftChips">
          <button type="button" class="chip" data-drift="Pomodoro">🍅 Pomodoro (+25 kcal)</button>
          <button type="button" class="chip" data-drift="Alcol">🍷 Alcol (+120 kcal)</button>
          <button type="button" class="chip" data-drift="Cena tardiva">🌙 Cena tardiva (+0 kcal)</button>
          <button type="button" class="chip" data-drift="Frittura/Grassi">🍟 Frittura/Grassi (+180 kcal)</button>
          <button type="button" class="chip" data-drift="Dolce">🍰 Dolce (+220 kcal)</button>
        </div>
      </div>

      <div class="field">
        <label>Reflusso / Digestione</label>
        <div class="chip-group" id="refluxChips">
          <button type="button" class="chip active-reflux-none" data-reflux="Assente">😌 Assente</button>
          <button type="button" class="chip" data-reflux="Lieve">😐 Lieve</button>
          <button type="button" class="chip" data-reflux="Forte">🔥 Forte</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="localCalcBtn" type="button">⚡ Calcolo locale</button>
        <button class="btn" id="clearFormBtn" type="button">Svuota campi</button>
      </div>

      <button class="btn-primary" id="saveEntryBtn" type="button">Salva nel Diario</button>
      <div class="status-msg" id="statusMsg"></div>
    </section>

    <!-- Storico Giorno -->
    <section class="card">
      <div class="stats-top">
        <h2 style="margin:0; font-size:1rem;">Registrazioni di oggi</h2>
        <span class="sub" id="entriesCount">0 voci</span>
      </div>
      <div id="entriesList"></div>
    </section>

    <!-- Esportazione -->
    <section class="card">
      <label>Report e Backup</label>
      <div class="export-grid">
        <button class="btn" id="copyReportBtn" type="button">📋 Copia Report</button>
        <button class="btn" id="exportCsvBtn" type="button">📊 Esporta CSV</button>
        <button class="btn" id="exportJsonBtn" type="button">💾 Backup JSON</button>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_ENTRIES = "diario_lampo_entries_v1";
    const STORAGE_SETTINGS = "diario_lampo_settings_v1";

    // Piano settimanale dal foglio Google (Giorno 1 - Giorno 7)
    const MEAL_PLAN = {
      "Giorno 1": [

      ],
      "Giorno 3": [
        { slot: "Colazione", desc: "2 uova sode o alla coque, 30–40 g pane integrale, cetriolo o lattuga, filo d'olio EVO", kcal: 325, protein: 17 },
        { slot: "Spuntino", desc: "1 banana non eccessiva o 15 g mandorle", kcal: 100, protein: 2 },

      "Giorno 4": [
        { slot: "Colazione", desc: "2 uova strapazzate morbide con spinacino, 30–40 g pane integrale, tisana tiepida", kcal: 325, protein: 18 },

        { slot: "Pranzo", desc: "70–80 g pasta integrale con crema leggera di zucchine e 1 cucchiaino di ricotta magra o parmigiano, verdure cotte, olio EVO", kcal: 460, protein: 16 },
        { slot: "Merenda", desc: "100 g yogurt bianco naturale", kcal: 70, protein: 5 },
        { slot: "Cena", desc: "140–160 g salmone o sgombro al forno/vapore, fagiolini lessati o al vapore, filo d'olio EVO", kcal: 430, protein: 32 }
      ],
      "Giorno 5": [
        { slot: "Colazione", desc: "2 uova sode su 30–40 g pane integrale, lattuga o rucola, filo d'olio EVO", kcal: 325, protein: 17 },
        { slot: "Spuntino", desc: "15 g noci o mandorle", kcal: 105, protein: 3 },

        { slot: "Cena", desc: "160–180 g nasello, merluzzo o sogliola al vapore/cartoccio, patate lesse o purea leggera, spinaci/bietole cotti con olio EVO", kcal: 410, protein: 33 }
      ],
      "Giorno 7": [
        { slot: "Colazione", desc: "2 uova alla coque o in camicia, 30–40 g pane integrale, cetrioli o insalata tenera, filo d'olio EVO, tisana tiepida", kcal: 325, protein: 17 },

        { slot: "Pranzo", desc: "70–80 g pasta o riso integrale con ragù bianco leggero di carne magra e verdure, olio EVO, verdure cotte", kcal: 550, protein: 31 },

        { slot: "Cena", desc: "Frittata al forno leggera con verdure (zucchine, carote, porri ben cotti), insalata tenera o finocchi cotti", kcal: 310, protein: 17 }

    const DRIFT_KCAL = {
      "Pomodoro": 25,
      "Alcol": 120,
      "Cena tardiva": 0,
      "Frittura/Grassi": 180,
      "Dolce": 220
    };

    const LOCAL_FOOD_DB = [
      { keys: ["riso", "basmati", "integrale"], kcalPer100: 130, protPer100: 2.7 },
      { keys: ["pasta", "spaghetti", "penne", "fusilli", "farro", "orzo", "couscous"], kcalPer100: 145, protPer100: 5.0 },
      { keys: ["pane", "friselle", "fette biscottate"], kcalPer100: 270, protPer100: 8.5 },
      { keys: ["pollo", "petto di pollo", "tacchino", "lonza"], kcalPer100: 120, protPer100: 23.0 },
      { keys: ["manzo", "vitello", "carne", "bistecca"], kcalPer100: 165, protPer100: 22.0 },
      { keys: ["merluzzo", "platessa", "orata", "branzino", "nasello", "sogliola", "pesce", "gamberi"], kcalPer100: 95, protPer100: 18.0 },
      { keys: ["salmone", "sgombro", "tonno"], kcalPer100: 185, protPer100: 21.0 },
      { keys: ["uova", "uovo", "frittata", "frittatina", "omelette"], kcalPer100: 145, protPer100: 12.5, unitGrams: 60 },
      { keys: ["yogurt", "skyr", "fiocchi di latte"], kcalPer100: 68, protPer100: 8.5, unitGrams: 150 },
      { keys: ["latte", "bevanda vegetale"], kcalPer100: 48, protPer100: 3.2, unitGrams: 200 },
      { keys: ["olio", "olio evo", "extravergine"], kcalPer100: 900, protPer100: 0, unitGrams: 10 },
      { keys: ["mandorle", "noci", "nocciole"], kcalPer100: 610, protPer100: 18.0, unitGrams: 15 },
      { keys: ["verdure", "zucchine", "melanzane", "insalata", "spinaci", "broccoli", "finocchi", "carote", "bietole", "fagiolini"], kcalPer100: 25, protPer100: 1.5, unitGrams: 150 },
      { keys: ["mela", "pera", "banana", "frutta", "kiwi", "arance"], kcalPer100: 55, protPer100: 0.7, unitGrams: 150 },
      { keys: ["pomodoro", "passata", "sugo"], kcalPer100: 25, protPer100: 1.2, unitGrams: 100 },
      { keys: ["vino", "birra", "calice"], kcalPer100: 80, protPer100: 0.2, unitGrams: 125 }
    ];

    let state = {
      entries: loadEntries(),
      settings: loadSettings(),
      selectedDrifts: new Set(),
      reflux: "Assente",
      photoBase64: null,
      photoMime: null
    };

    function todayISO() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function nowTime() {
      const d = new Date();
      return d.toTimeString().slice(0, 5);
    }

    function loadEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_ENTRIES) || "[]");
      } catch {
        return [];
      }
    }

    function loadSettings() {
      const allowedModels = new Set([
        "gemini-3.8-flash",
        "gemini-3.5-flash-lite",
        "gemini-flash-latest",
        "custom"
      ]);
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || "{}");
        const model = allowedModels.has(parsed.model) ? parsed.model : "gemini-3.8-flash";
        return {
          apiKey: parsed.apiKey || "",
          model,
          customModel: parsed.customModel || "",
          targetKcal: parsed.targetKcal || 1725,
          selectedDay: MEAL_PLAN[parsed.selectedDay] ? parsed.selectedDay : "Giorno 1"
        };
      } catch {
        return { apiKey: "", model: "gemini-3.8-flash", customModel: "", targetKcal: 1725, selectedDay: "Giorno 1" };
      }
    }

    function saveEntries() {
      localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(state.entries));
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(state.settings));
    }

    function getActiveModel() {
      if (state.settings.model === "custom") {
        return (state.settings.customModel || "").trim() || "gemini-3.8-flash";
      }
      return state.settings.model || "gemini-3.8-flash";
    }

    function syncCustomModelVisibility() {
      const val = document.getElementById("modelSelect").value;
      document.getElementById("customModelField").classList.toggle("hidden", val !== "custom");
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg;
      el.style.color = isError ? "#fca5a5" : "#7dd3fc";
    }

    function renderPresetButtons() {
      const day = document.getElementById("planDaySelect").value;
      const items = MEAL_PLAN[day] || [];
      const container = document.getElementById("presetButtons");
      container.innerHTML = items
        .map((item, idx) => `
          <button type="button" class="preset-btn" onclick="applyPreset('${day}', ${idx})">
            <div class="preset-btn-top">
              <span>${escapeHtml(item.slot)}</span>
              <span>${item.kcal} kcal</span>
            </div>
            <div class="preset-btn-desc">${escapeHtml(item.desc)}</div>
          </button>
        `)
        .join("");
    }

    function applyPreset(day, idx) {
      const item = (MEAL_PLAN[day] || [])[idx];
      if (!item) return;

      document.getElementById("mealType").value = item.slot;
      document.getElementById("mealDesc").value = item.desc;

      let totalKcal = item.kcal;
      state.selectedDrifts.forEach(d => {
        totalKcal += DRIFT_KCAL[d] || 0;
      });

      document.getElementById("mealKcal").value = totalKcal;
      document.getElementById("mealProtein").value = item.protein;
      setStatus(`Caricato: ${day} · ${item.slot} (${totalKcal} kcal). Controlla e salva.`);
    }

    function initForm() {
      document.getElementById("mealTime").value = nowTime();
      document.getElementById("apiKeyInput").value = state.settings.apiKey || "";
      document.getElementById("modelSelect").value = state.settings.model || "gemini-3.8-flash";
      document.getElementById("customModelInput").value = state.settings.customModel || "";
      document.getElementById("targetKcalInput").value = state.settings.targetKcal || 1725;
      document.getElementById("planDaySelect").value = state.settings.selectedDay || "Giorno 1";
      syncCustomModelVisibility();
      renderPresetButtons();
      document.getElementById("todayLabel").textContent =
        `Oggi ${todayISO()} · Target ${state.settings.targetKcal} kcal`;
    }

    function renderStatsAndList() {
      const today = todayISO();
      const todayEntries = state.entries.filter(e => e.date === today);
      const totalKcal = todayEntries.reduce((acc, e) => acc + (Number(e.kcal) || 0), 0);
      const totalProt = todayEntries.reduce((acc, e) => acc + (Number(e.protein) || 0), 0);
      const totalDrifts = todayEntries.reduce((acc, e) => acc + (e.drifts ? e.drifts.length : 0), 0);
      const target = Number(state.settings.targetKcal) || 1725;
      const remaining = target - totalKcal;
      const pct = Math.min(100, Math.max(0, (totalKcal / target) * 100));

      document.getElementById("kcalConsumed").textContent = totalKcal.toLocaleString("it-IT");
      document.getElementById("kcalRemaining").textContent =
        remaining >= 0 ? `Residuo: ${remaining.toLocaleString("it-IT")} kcal` : `Eccedenza: +${Math.abs(remaining).toLocaleString("it-IT")} kcal`;
      document.getElementById("proteinSummary").textContent = `Proteine stimate: ${Math.round(totalProt)} g`;
      document.getElementById("driftCountSummary").textContent = `Drift oggi: ${totalDrifts}`;
      document.getElementById("entriesCount").textContent = `${todayEntries.length} voci`;
      document.getElementById("todayLabel").textContent = `Oggi ${today} · Target ${target} kcal`;

      const bar = document.getElementById("kcalBar");
      bar.style.width = `${pct}%`;
      bar.style.background = totalKcal > target ? "var(--warn)" : "var(--accent)";

      const listEl = document.getElementById("entriesList");
      if (!todayEntries.length) {
        listEl.innerHTML = `<div class="sub">Nessuna registrazione per oggi. Scegli un pasto predefinito o scatta una foto.</div>`;
        return;
      }

      listEl.innerHTML = todayEntries
        .slice()
        .reverse()
        .map(item => {
          const driftBadges = (item.drifts || [])
            .map(d => `<span class="badge b-drift">${escapeHtml(d)}</span>`)
            .join("");
          const refluxClass =
            item.reflux === "Forte" ? "b-reflux-2" : item.reflux === "Lieve" ? "b-reflux-1" : "b-reflux-0";
          const protText = item.protein ? ` · ${item.protein}g pro` : "";

          return `
            <div class="entry">
              <div class="entry-top">
                <div class="entry-title">${escapeHtml(item.mealType)} · ${escapeHtml(item.time || "")}</div>
                <div class="entry-kcal">${Number(item.kcal) || 0} kcal${protText}</div>
              </div>
              <div class="entry-meta">${escapeHtml(item.description || "")}</div>
              <div class="badges">
                <span class="badge ${refluxClass}">Reflusso: ${escapeHtml(item.reflux || "Assente")}</span>
                ${driftBadges}
              </div>
              <div class="entry-actions">
                <button class="mini-link del" onclick="deleteEntry('${item.id}')">Elimina</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    function deleteEntry(id) {
      state.entries = state.entries.filter(e => e.id !== id);
      saveEntries();
      renderStatsAndList();
    }

    function estimateLocalNutrition() {
      const desc = (document.getElementById("mealDesc").value || "").toLowerCase();
      let kcal = 0;
      let protein = 0;

      const segments = desc.split(/[,;+]+/);
      segments.forEach(seg => {
        const clean = seg.trim();
        if (!clean) return;
        const matchFood = LOCAL_FOOD_DB.find(food =>
          food.keys.some(k => new RegExp(`\\b${k}\\b`, "i").test(clean))
        );
        if (!matchFood) return;

        const gramMatch = clean.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gr|grammi|ml)\b/i);
        const spoonMatch = clean.match(/(\d+(?:[.,]\d+)?)\s*(?:cucchiai|cucchiaio|cucchiaini|cucchiaino)\b/i);
        const glassMatch = clean.match(/(\d+(?:[.,]\d+)?)\s*(?:calice|calici|bicchiere|bicchieri|tazza|tazze)\b/i);

        let grams = matchFood.unitGrams || 100;
        if (gramMatch) {
          grams = parseFloat(gramMatch[1].replace(",", "."));
        } else if (spoonMatch) {
          grams = parseFloat(spoonMatch[1].replace(",", ".")) * 10;
        } else if (glassMatch) {
          grams = parseFloat(glassMatch[1].replace(",", ".")) * 150;
        }

        kcal += (matchFood.kcalPer100 * grams) / 100;
        protein += (matchFood.protPer100 * grams) / 100;
      });

      state.selectedDrifts.forEach(d => {
        kcal += DRIFT_KCAL[d] || 0;
      });

      if (kcal > 0) {
        document.getElementById("mealKcal").value = Math.round(kcal / 5) * 5;
        document.getElementById("mealProtein").value = Math.round(protein);
        setStatus("Stima locale applicata (puoi modificarla prima di salvare).");
      } else {
        setStatus("Nessun alimento noto nel dizionario locale: inserisci le kcal a mano o usa Gemini AI.", true);
      }
    }

    async function compressImage(file, maxSide = 1024, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve({
              dataUrl,
              base64: dataUrl.split(",")[1],
              mimeType: "image/jpeg"
            });
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function analyzeWithGemini(mode) {
      const apiKey = (state.settings.apiKey || "").trim();
      if (!apiKey) {
        document.getElementById("settingsPanel").classList.remove("hidden");
        setStatus("Inserisci prima la tua Gemini API Key nelle Impostazioni.", true);
        return;
      }

      const textDesc = (document.getElementById("mealDesc").value || "").trim();
      const mealTime = document.getElementById("mealTime").value || nowTime();
      if (mode === "photo" && !state.photoBase64) {
        setStatus("Seleziona o scatta prima una foto del piatto.", true);
        return;
      }
      if (mode === "text" && !textDesc) {
        setStatus("Scrivi prima cosa hai mangiato per stimare con AI.", true);
        return;
      }

      const prompt = [
        "Sei un assistente nutrizionale per un diario alimentare rapido.",
        "Analizza il pasto e rispondi ESCLUSIVAMENTE con un oggetto JSON valido (senza markdown o testo extra).",
        "Schema JSON: {\"description\": string, \"kcal\": number, \"protein\": number, \"drifts\": string[], \"reflux_risk\": \"Assente\"|\"Lieve\"|\"Forte\"}.",
        "Valori permessi per drifts: \"Pomodoro\", \"Alcol\", \"Cena tardiva\", \"Frittura/Grassi\", \"Dolce\".",
        `Ora del pasto: ${mealTime} (se >= 21:30 valuta \"Cena tardiva\" se rilevante).`,
        textDesc ? `Note utente: ${textDesc}` : "Stima porzioni visibili in modo realistico."
      ].join("\n");

      const parts = [{ text: prompt }];
      if (mode === "photo" && state.photoBase64) {
        parts.push({
          inlineData: {
            mimeType: state.photoMime || "image/jpeg",
            data: state.photoBase64
          }
        });
      }

      const model = getActiveModel();
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;

      setStatus(`Analisi con ${model} in corso...`);
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts }],
            generationConfig: {
              temperature: 0.2,
              responseMimeType: "application/json"
            }
          })
        });

        if (!res.ok) {
          const errBody = await res.text();
          throw new Error(`HTTP ${res.status}: ${errBody.slice(0, 140)}`);
        }

        const data = await res.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/^```json\s*|\s*```$/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        if (parsed.description) {
          document.getElementById("mealDesc").value = parsed.description;
        }
        if (typeof parsed.kcal === "number") {
          document.getElementById("mealKcal").value = Math.round(parsed.kcal);
        }
        if (typeof parsed.protein === "number") {
          document.getElementById("mealProtein").value = Math.round(parsed.protein);
        }
        if (Array.isArray(parsed.drifts)) {
          state.selectedDrifts.clear();
          parsed.drifts.forEach(d => {
            if (Object.prototype.hasOwnProperty.call(DRIFT_KCAL, d)) {
              state.selectedDrifts.add(d);
            }
          });
          syncDriftChips();
        }
        if (parsed.reflux_risk && ["Assente", "Lieve", "Forte"].includes(parsed.reflux_risk)) {
          state.reflux = parsed.reflux_risk;
          syncRefluxChips();
        }

        setStatus("Compilazione AI completata. Controlla e salva.");
      } catch (err) {
        setStatus(`Errore Gemini: ${err.message}`, true);
      }
    }

    function syncDriftChips() {
      document.querySelectorAll("#driftChips .chip").forEach(chip => {
        const d = chip.dataset.drift;
        chip.classList.toggle("active-drift", state.selectedDrifts.has(d));
      });
    }

    function syncRefluxChips() {
      document.querySelectorAll("#refluxChips .chip").forEach(chip => {
        const r = chip.dataset.reflux;
        chip.className = "chip";
        if (r === state.reflux) {
          if (r === "Assente") chip.classList.add("active-reflux-none");
          else if (r === "Lieve") chip.classList.add("active-reflux-mild");
          else chip.classList.add("active-reflux-high");
        }
      });
    }

    function clearForm() {
      document.getElementById("mealDesc").value = "";
      document.getElementById("mealKcal").value = "";
      document.getElementById("mealProtein").value = "";
      document.getElementById("mealTime").value = nowTime();
      state.selectedDrifts.clear();
      state.reflux = "Assente";
      state.photoBase64 = null;
      state.photoMime = null;
      const img = document.getElementById("photoPreview");
      img.src = "";
      img.classList.add("hidden");
      syncDriftChips();
      syncRefluxChips();
    }

    function buildTextReport() {
      const lines = ["DIARIO LAMPO - REPORT", ""];
      const byDate = {};
      state.entries.forEach(e => {
        byDate[e.date] = byDate[e.date] || [];
        byDate[e.date].push(e);
      });
      Object.keys(byDate).sort().reverse().forEach(date => {
        const dayItems = byDate[date];
        const sumKcal = dayItems.reduce((a, b) => a + (Number(b.kcal) || 0), 0);
        lines.push(`📅 ${date} — Totale: ${sumKcal} kcal`);
        dayItems.forEach(i => {
          const driftsStr = i.drifts && i.drifts.length ? ` | Drift: ${i.drifts.join(", ")}` : "";
          const proStr = i.protein ? ` (${i.protein}g pro)` : "";
          lines.push(`• [${i.time || ""}] ${i.mealType}: ${i.description} — ${i.kcal || 0} kcal${proStr} | Reflusso: ${i.reflux}${driftsStr}`);
        });
        lines.push("");
      });
      return lines.join("\n").trim();
    }

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Event listeners
    document.getElementById("toggleSettingsBtn").addEventListener("click", () => {
      document.getElementById("settingsPanel").classList.toggle("hidden");
    });

    document.getElementById("modelSelect").addEventListener("change", syncCustomModelVisibility);

    document.getElementById("planDaySelect").addEventListener("change", () => {
      state.settings.selectedDay = document.getElementById("planDaySelect").value;
      saveSettings();
      renderPresetButtons();
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      state.settings.apiKey = document.getElementById("apiKeyInput").value.trim();
      state.settings.model = document.getElementById("modelSelect").value;
      state.settings.customModel = document.getElementById("customModelInput").value.trim();
      state.settings.targetKcal = parseInt(document.getElementById("targetKcalInput").value, 10) || 1725;
      saveSettings();
      renderStatsAndList();
      document.getElementById("settingsPanel").classList.add("hidden");
      setStatus(`Impostazioni salvate (${getActiveModel()}).`);
    });

    document.querySelectorAll("#driftChips .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const d = chip.dataset.drift;
        if (state.selectedDrifts.has(d)) state.selectedDrifts.delete(d);
        else state.selectedDrifts.add(d);
        syncDriftChips();
      });
    });

    document.querySelectorAll("#refluxChips .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        state.reflux = chip.dataset.reflux;
        syncRefluxChips();
      });
    });

    document.getElementById("localCalcBtn").addEventListener("click", estimateLocalNutrition);
    document.getElementById("clearFormBtn").addEventListener("click", () => {
      clearForm();
      setStatus("Campi svuotati.");
    });

    document.getElementById("photoBtn").addEventListener("click", () => {
      document.getElementById("photoInput").click();
    });

    document.getElementById("photoInput").addEventListener("change", async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const compressed = await compressImage(file);
        state.photoBase64 = compressed.base64;
        state.photoMime = compressed.mimeType;
        const img = document.getElementById("photoPreview");
        img.src = compressed.dataUrl;
        img.classList.remove("hidden");
        await analyzeWithGemini("photo");
      } catch (err) {
        setStatus(`Errore immagine: ${err.message}`, true);
      }
      e.target.value = "";
    });

    document.getElementById("aiTextBtn").addEventListener("click", () => analyzeWithGemini("text"));

    document.getElementById("saveEntryBtn").addEventListener("click", () => {
      const desc = (document.getElementById("mealDesc").value || "").trim();
      let kcal = parseInt(document.getElementById("mealKcal").value, 10);
      const protein = parseInt(document.getElementById("mealProtein").value, 10) || 0;

      if (!desc && !kcal) {
        setStatus("Inserisci almeno una descrizione del pasto o le calorie.", true);
        return;
      }
      if (Number.isNaN(kcal)) {
        kcal = 0;
      }

      const entry = {
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        date: todayISO(),
        time: document.getElementById("mealTime").value || nowTime(),
        mealType: document.getElementById("mealType").value,
        description: desc || "Pasto registrato",
        kcal,
        protein,
        drifts: Array.from(state.selectedDrifts),
        reflux: state.reflux
      };

      state.entries.push(entry);
      saveEntries();
      renderStatsAndList();
      clearForm();
      setStatus("Salvato in locale su questo iPhone.");
    });

    document.getElementById("copyReportBtn").addEventListener("click", async () => {
      const text = buildTextReport();
      try {
        await navigator.clipboard.writeText(text);
        setStatus("Report copiato negli appunti.");
      } catch {
        setStatus("Copia non riuscita: usa Esporta CSV o Backup JSON.", true);
      }
    });

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      const header = "Data,Ora,Momento,Descrizione,Kcal,Proteine_g,Drift,Reflusso\n";
      const rows = state.entries.map(e => [
        e.date,
        e.time || "",
        e.mealType,
        `"${String(e.description || "").replace(/"/g, '""')}"`,
        e.kcal || 0,
        e.protein || 0,
        `"${(e.drifts || []).join(" | ")}"`,
        e.reflux || ""
      ].join(","));
      downloadFile(`diario-lampo-${todayISO()}.csv`, header + rows.join("\n"), "text/csv;charset=utf-8;");
      setStatus("CSV esportato.");
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        entries: state.entries,
        targetKcal: state.settings.targetKcal
      }, null, 2);
      downloadFile(`diario-lampo-backup-${todayISO()}.json`, payload, "application/json");
      setStatus("Backup JSON salvato.");
    });

    document.getElementById("triggerRestoreBtn").addEventListener("click", () => {
      document.getElementById("restoreFileInput").click();
    });

    document.getElementById("restoreFileInput").addEventListener("change", e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed.entries)) {
            state.entries = parsed.entries;
            saveEntries();
            if (parsed.targetKcal) {
              state.settings.targetKcal = parsed.targetKcal;
              saveSettings();
              initForm();
            }
            renderStatsAndList();
            setStatus("Backup ripristinato correttamente.");
          } else {
            setStatus("File di backup non valido.", true);
          }
        } catch {
          setStatus("Errore nella lettura del file JSON.", true);
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    initForm();
    renderStatsAndList();
  </script>
